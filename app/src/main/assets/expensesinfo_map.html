<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Expense Location</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Prevent body scroll */
        }
        .leaflet-control-attribution {
    display: none !important;
}
        #mapid {
            height: 100vh;
            width: 100%;
            position: relative;
        }
        .popup-content {
            max-width: 200px;
            font-size: 14px;
            line-height: 1.4;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .address {
            font-weight: bold;
            color: #333;
        }
        .coordinates {
            display: none;
        }

        /* Custom zoom controls styling */
        .leaflet-control-zoom {
            border: none !important;
            border-radius: 8px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2) !important;
        }

        .leaflet-control-zoom a {
            background-color: #fff !important;
            border: 1px solid #ccc !important;
            color: #333 !important;
            font-size: 18px !important;
            line-height: 30px !important;
            width: 32px !important;
            height: 32px !important;
        }

        .leaflet-control-zoom a:hover {
            background-color: #f0f0f0 !important;
        }

        /* Custom marker styling */
        .expense-marker {
            background-color: #e74c3c;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
<div id="mapid"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
    let map;
    let locationMarker;

    function initMap() {
        map = L.map('mapid', {
            zoomControl: false, // Enable zoom controls
            scrollWheelZoom: true, // Enable scroll wheel zoom
            doubleClickZoom: true, // Enable double click zoom
            touchZoom: true, // Enable touch zoom (pinch)
            keyboard: true, // Enable keyboard navigation
            dragging: true, // Enable map dragging
            attributionControl: false, // Remove attribution
            zoomSnap: 0.5, // Allow half-zoom levels for smoother zooming
            zoomDelta: 0.5, // Zoom delta for controls
            maxZoom: 18, // Maximum zoom level
            minZoom: 3 // Minimum zoom level
        }).setView([20.5937, 78.9629], 5);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '',
            maxZoom: 18
        }).addTo(map);

        // Position zoom controls
        map.zoomControl.setPosition('bottomright');

        // Add custom CSS class to map container for better touch handling
        const mapContainer = document.getElementById('mapid');
        mapContainer.style.touchAction = 'none'; // Prevent browser zoom on touch
    }

    async function reverseGeocode(latitude, longitude) {
        try {
            const response = await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&addressdetails=1`
            );

            if (!response.ok) {
                throw new Error('Geocoding request failed');
            }

            const data = await response.json();

            if (data && data.display_name) {
                return {
                    success: true,
                    address: data.display_name,
                    details: data.address
                };
            } else {
                return {
                    success: false,
                    error: 'No address found'
                };
            }
        } catch (error) {
            console.error('Reverse geocoding error:', error);
            return {
                success: false,
                error: 'Failed to get address'
            };
        }
    }

    function formatAddress(address, details) {
        if (!details) return address;

        const parts = [];

        if (details.house_number && details.road) {
            parts.push(`${details.house_number} ${details.road}`);
        } else if (details.road) {
            parts.push(details.road);
        }

        if (details.neighbourhood) {
            parts.push(details.neighbourhood);
        } else if (details.suburb) {
            parts.push(details.suburb);
        }

        if (details.city) {
            parts.push(details.city);
        } else if (details.town) {
            parts.push(details.town);
        } else if (details.village) {
            parts.push(details.village);
        }

        if (details.state) {
            parts.push(details.state);
        }

        if (details.postcode) {
            parts.push(details.postcode);
        }

        return parts.length > 0 ? parts.join(', ') : address;
    }

    async function showExpenseLocation(latitude, longitude) {
        if (typeof latitude !== 'number' || typeof longitude !== 'number') {
            console.error('Invalid coordinates provided: latitude or longitude is not a number');
            return;
        }

        // Update map view with a reasonable zoom level
        map.setView([latitude, longitude], 15);

        // Remove existing marker if any
        if (locationMarker) {
            map.removeLayer(locationMarker);
        }

        // Create custom icon for expense location
        const customIcon = L.divIcon({
            className: 'expense-marker',
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, -10],
            html: '<div style="width: 100%; height: 100%; background-color: #e74c3c; border-radius: 50%;"></div>'
        });

        const initialPopupContent = `
            <div class="popup-content">
                <div class="loading">Loading address...</div>
            </div>
        `;

        // Add marker for the expense location with custom icon
        locationMarker = L.marker([latitude, longitude], { icon: customIcon })
            .addTo(map)
            .bindPopup(initialPopupContent, {
                closeButton: false,
                className: 'custom-popup'
            });

        // Show popup immediately
        locationMarker.openPopup();

        // Perform reverse geocoding
        const geocodeResult = await reverseGeocode(latitude, longitude);

        let finalPopupContent;

        if (geocodeResult.success) {
            const formattedAddress = formatAddress(geocodeResult.address, geocodeResult.details);
            finalPopupContent = `
                <div class="popup-content">
                    <div class="address">${formattedAddress}</div>
                </div>
            `;
        } else {
            finalPopupContent = `
                <div class="popup-content">
                    <div class="address">Expense Location</div>
                    <div style="color: #e74c3c; font-size: 12px;">
                        ${geocodeResult.error}
                    </div>
                </div>
            `;
        }

        // Update popup content with address
        locationMarker.setPopupContent(finalPopupContent);
    }

    // Prevent context menu on long press (mobile)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Initialize map when page loads
    document.addEventListener('DOMContentLoaded', initMap);

    // Expose showExpenseLocation to the Android WebView
    window.showExpenseLocation = showExpenseLocation;
</script>
</body>
</html>
