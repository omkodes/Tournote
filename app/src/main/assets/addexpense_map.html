<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
        .popup-content {
            max-width: 200px;
            font-size: 14px;
            line-height: 1.4;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .address {
            font-weight: bold;
            color: #333;
        }
        .coordinates {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
    let map;
    let locationMarker;

    // Initialize map
    function initMap() {
        map = L.map('map', {
            zoomControl: false // Disable zoom controls
        }).setView([20.5937, 78.9629], 5); // Default to India

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
    }

    // Function to perform reverse geocoding
    async function reverseGeocode(latitude, longitude) {
        try {
            const response = await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&addressdetails=1`
            );

            if (!response.ok) {
                throw new Error('Geocoding request failed');
            }

            const data = await response.json();

            if (data && data.display_name) {
                return {
                    success: true,
                    address: data.display_name,
                    details: data.address
                };
            } else {
                return {
                    success: false,
                    error: 'No address found'
                };
            }
        } catch (error) {
            console.error('Reverse geocoding error:', error);
            return {
                success: false,
                error: 'Failed to get address'
            };
        }
    }

    // Function to format address for display
    function formatAddress(address, details) {
        if (!details) return address;

        // Try to create a shorter, more readable address
        const parts = [];

        if (details.house_number && details.road) {
            parts.push(`${details.house_number} ${details.road}`);
        } else if (details.road) {
            parts.push(details.road);
        }

        if (details.neighbourhood) {
            parts.push(details.neighbourhood);
        } else if (details.suburb) {
            parts.push(details.suburb);
        }

        if (details.city) {
            parts.push(details.city);
        } else if (details.town) {
            parts.push(details.town);
        } else if (details.village) {
            parts.push(details.village);
        }

        if (details.state) {
            parts.push(details.state);
        }

        if (details.postcode) {
            parts.push(details.postcode);
        }

        return parts.length > 0 ? parts.join(', ') : address;
    }

    // Function to be called from Android/Kotlin
    async function showLocationOnMap(latitude, longitude) {
        // Update map view
        map.setView([latitude, longitude], 15);

        // Remove existing marker if any
        if (locationMarker) {
            map.removeLayer(locationMarker);
        }

        // Create popup content with loading message
        const popupContent = `
            <div class="popup-content">
                <div class="loading">Loading address...</div>
            </div>
        `;

        // Add marker for the location with initial popup
        locationMarker = L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup(popupContent);

        // Perform reverse geocoding
        const geocodeResult = await reverseGeocode(latitude, longitude);

        let finalPopupContent;

        if (geocodeResult.success) {
            const formattedAddress = formatAddress(geocodeResult.address, geocodeResult.details);
            finalPopupContent = `
                <div class="popup-content">
                    <div class="address">${formattedAddress}</div>
                </div>
            `;
        } else {
            finalPopupContent = `
                <div class="popup-content">
                    <div class="address">Location</div>
                    <div style="color: #e74c3c; font-size: 12px;">
                        ${geocodeResult.error}
                    </div>
                </div>
            `;
        }

        // Update popup content with address
        locationMarker.setPopupContent(finalPopupContent);
    }

    // Initialize map when page loads
    document.addEventListener('DOMContentLoaded', initMap);
</script>
</body>
</html>
